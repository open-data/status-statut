name: Public status data
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Static Site CI', 'Setup CI']
    types: [completed]
permissions:
  contents: write
  issues: read
  pages: write
concurrency:
  group: ${{ github.repository }}-public-status-data
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check public-data privacy guards
        run: python3 -m unittest discover -s tests -p test_public_status.py -v
      - name: Export public data and publish credential-free files
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/publish-public-status.py
          --repository "$GITHUB_REPOSITORY"
          --source .
          --work-dir "$RUNNER_TEMP/public-status"
          --publish

      - name: Publish the updated Pages pointer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" > /dev/null
