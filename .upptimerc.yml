  errorTitle: "An error occurred / Une erreur est survenue"
  errorIntro: "An error occurred in trying to get the latest status details. / Une erreur est survenue lors du chargement des dernières données."
  errorText: "You can try again in a few moments. / Réessayez dans quelques instants."
  errorHome: "Go to the homepage / Aller à la page d’accueil"
  rateLimitExceededTitle: "Rate limit exceeded / Limite de requêtes atteinte"
  rateLimitExceededIntro: "You have exceeded the number of requests you can do in an hour, so you'll have to wait before accessing this website again. Alternately, you can add a GitHub Personal Access Token to continue to use this website. / Vous avez atteint la limite horaire de requêtes. Patientez avant de réessayer ou ajoutez un jeton d’accès personnel GitHub."
  rateLimitExceededWhatDoesErrorMean: "What does this error mean? / Que signifie cette erreur?"
  rateLimitExceededErrorMeaning: "This website uses the GitHub API to access real-time data about our websites' status. By default, GitHub allows each IP address 60 requests per hour, which you have consumed. / Ce site utilise l’API GitHub pour obtenir les données de disponibilité. Vous avez utilisé les 60 requêtes par heure autorisées pour votre adresse IP."
  rateLimitExceededErrorHowCanFix: "How can I fix it? / Comment résoudre ce problème?"
  rateLimitExceededErrorFix: "You can wait for another hour and your IP address' limit will be restored. Alternately, you can add your GitHub Personal Access Token, which gives you an additional 5,000 requests per hour. / Attendez le rétablissement de votre limite horaire ou ajoutez un jeton d’accès personnel GitHub pour augmenter la limite de requêtes."
  rateLimitExceededGeneratePAT: "Learn how to generate a Personal Access Token / Comment créer un jeton d’accès personnel"
  rateLimitExceededHasSet: "You have a personal access token set. / Un jeton d’accès personnel est enregistré."
  rateLimitExceededRemoveToken: "Remove token / Supprimer le jeton"
  rateLimitExceededGitHubPAT: "GitHub Personal Access Token / Jeton d’accès personnel GitHub"
  rateLimitExceededCopyPastePAT: "Copy and paste your token / Copiez et collez votre jeton"
  rateLimitExceededSaveToken: "Save token / Enregistrer le jeton"
