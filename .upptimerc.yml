# Change these first
owner: open-data
repo: status-statut

sites:
  - name: Portal
    url: https://open.canada.ca
  - name: CKAN
    url: https://open.canada.ca/data/en/dataset/2916fad5-ebcc-4c86-b0f3-4f619b29f412
  - name: Open Data Search
    url: https://search.open.canada.ca/opendata
  - name: Contracts Search
    url: https://search.open.canada.ca/contracts/
  - name: Contracts Search details
    url: https://search.open.canada.ca/contracts/record/tbs-sct,Contracts-TBS-Historical-05257
  - name: ATI Search
    url: https://open.canada.ca/en/search/ati
    type: globalping
    location: Ottawa+Canada
  - name: ATI Search details
    url: https://open.canada.ca/en/search/ati/reference/0c9449bde99814b30ee8e467528b2fac
    type: globalping
    location: Ottawa+Canada
  - name: Open Maps
    url: https://open.canada.ca/openmap/en.html#05586948-c5ac-4de9-b9ef-a31020b0dc43
  - name: CKAN Datastore API
    slug: ckan-sql-api
    url: https://open.canada.ca/data/en/api/3/action/datastore_search?resource_id=grants
  - name: NGINX Static Files
    url: https://open.canada.ca/GCWeb/assets/sig-blk-en.svg

status-website:
  # Add your custom domain name, or remove the `cname` line if you don't have a domain
  # Uncomment the `baseUrl` line if you don't have a custom domain and add your repo name there
  baseUrl: /status-statut
  logoUrl: https://raw.githubusercontent.com/upptime/upptime.js.org/master/static/img/icon.svg
  name: Service status / État des services
  hideNavLogo: true
  favicon: https://wet-boew.github.io/themes-dist/GCWeb/GCWeb/assets/favicon-mobile.png
  customHeadHtml: |
    <link rel="icon" type="image/x-icon" href="https://wet-boew.github.io/themes-dist/GCWeb/GCWeb/assets/favicon.ico" data-gcds-favicon>
  customBodyHtml: |
    <header class="gcds-brand-header" data-gcds-brand-header data-gcds-breadcrumb-header data-gcds-repository-footer>
      <div class="container">
        <a class="gcds-signature" href="https://www.canada.ca/">
          <img src="https://wet-boew.github.io/themes-dist/GCWeb/GCWeb/assets/sig-blk-en.svg" alt="Government of Canada / Gouvernement du Canada" width="819" height="76">
        </a>
        <div data-gcds-language-slot></div>
      </div>
    </header>
    <template data-gcds-brand-footer>
      <div class="gcds-brand-footer">
        <div class="container">
          <img src="https://wet-boew.github.io/themes-dist/GCWeb/GCWeb/assets/wmms-blk.svg" alt="Canada" width="143" height="34">
        </div>
      </div>
    </template>
  introTitle: "Open.Canada.ca System Status / État des systèmes d’Open.Canada.ca"
  introMessage: Availability and response times for Open Government services. / Disponibilité et temps de réponse des services du gouvernement ouvert.
  navbar: []
  theme: light
  themeUrl: https://open-data.github.io/status-statut/gcds.css
  scripts:
    - src: /status-statut/gcds-i18n.js
      async: true
  links:
    - rel: stylesheet
      href: https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Noto+Sans:wght@400;700&display=swap

# Upptime also supports notifications, assigning issues, and more
# See https://upptime.js.org/docs/configuration

